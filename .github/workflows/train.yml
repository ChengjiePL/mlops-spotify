name: Train & Register Model

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/promote_model.py'
      - 'requirements.txt'
      - '.github/workflows/train.yml'
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    environment: databricks

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      MLFLOW_EXPERIMENT_PATH: ${{ vars.MLFLOW_EXPERIMENT_PATH }}
      MODEL_NAME: ${{ vars.MODEL_NAME }}
      MODEL_ALIAS: ${{ vars.MODEL_ALIAS }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Databricks auth
        run: |
          curl -sf -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            "$DATABRICKS_HOST/api/2.0/preview/scim/v2/Me" > /dev/null
          echo "Auth OK"

      - name: Setup Kaggle credentials
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
      
      - name: Download dataset
        run: |
          mkdir -p data
          kaggle datasets download zaheenhamidani/ultimate-spotify-tracks-db -p data --unzip

      - name: Train + register
        working-directory: src
        run: python train.py

      - name: Report metrics
        run: |
          python <<'PY'
          import json, os
          from pathlib import Path

          m = json.loads(Path("metrics.json").read_text())
          lines = [
              "## Training metrics",
              "",
              "| Metric | Value |",
              "|--------|-------|",
              f"| Accuracy | `{m['accuracy']:.4f}` |",
              f"| AUC | `{m['auc']:.4f}` |",
              f"| Run ID | `{m['run_id']}` |",
              f"| Model | `{m['model_name']}` |",
              f"| Experiment | `{m['experiment_path']}` |",
              "",
          ]
          summary = "\n".join(lines)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary + "\n")
          print(summary)
          PY

      # - name: Upload metrics artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: training-metrics
      #     path: metrics.json

      - name: Promote to production alias
        run: python scripts/promote_model.py
